    <script>
      // Apply saved theme before first paint (default: dark).
      (function () {
        try {
          var t = localStorage.getItem("syntara-theme");
          document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();

  <body>
    <noscript>
      <main>
        <h1>Syntara Playground — chat with your local model</h1>
        <p>
          This page is a minimal chat client for the OpenAI-compatible API that Syntara
          exposes on your own machine. It needs JavaScript to stream responses from your
          local gateway at <code>http://127.0.0.1:8000</code>.
        </p>
        <ul>
          <li>Start the Syntara desktop app and enable the local API server in Settings.</li>
          <li>Load a model, then open this page and press Connect.</li>
          <li>Your prompts go from this tab to your machine only — nothing is relayed.</li>
        </ul>
        <p>
          Enable JavaScript for the interactive playground, or read the API docs in the
          <a href="https://github.com/saritchakraborty09012012/syntara-nde">repository</a>.
        </p>
      </main>
    </noscript>

      <main>
        <h1>Privacy Policy</h1>
        <p>Last updated: October 4, 2026</p>
        <p>
          NDE ("we", "us", or "our") respects your privacy. Syntara is designed with privacy
          and local-first usage in mind.
        </p>

        <h2>1. Information We Collect</h2>
        <p>
          We do not intentionally collect, sell, rent, or require personal information from
          users of Syntara.
        </p>
        <p>Syntara does not require:</p>
        <ul>
          <li>Account creation or login</li>
          <li>Email addresses</li>
          <li>Names</li>
          <li>Phone numbers</li>
          <li>Passwords</li>
          <li>Payment information</li>
          <li>Personal profiles</li>
        </ul>
        <p>
          Syntara is designed to run locally on your device, and your local data, chats,
          projects, memories, settings, and files are intended to remain on your device unless
          you choose to use an external service or integration.
        </p>

        <h2>2. Data Stored by Syntara</h2>
        <p>
          Syntara may store application data locally on your device when required for its
          functionality, such as settings, downloaded models, conversations, projects,
          memories, logs, and other application configuration.
        </p>
        <p>This data is stored locally and is not intentionally transmitted to NDE.</p>
        <p>
          You remain responsible for managing and protecting data stored on your own device.
        </p>

        <h2>3. Third-Party Services</h2>
        <p>
          Syntara may allow users to connect external services, APIs, model providers,
          integrations, or other third-party tools.
        </p>
        <p>
          When you choose to use such services, those services may process information
          according to their own privacy policies and terms. NDE does not control the privacy
          practices of third-party services.
        </p>

        <h2>4. Website</h2>
        <p>Our website does not require an account or registration.</p>
        <p>
          Our hosting, content-delivery, analytics, security, or other infrastructure providers
          may process limited technical information such as IP addresses, browser information,
          device information, or server logs as part of operating and securing the website. Such
          processing is controlled by the respective service providers and their applicable
          policies.
        </p>

        <h2>5. Open Source</h2>
        <p>
          Syntara is open source and released under the MIT License. The source code is publicly
          available so that anyone can inspect, modify, and redistribute it in accordance with
          the applicable license.
        </p>
        <p>
          The open-source nature of Syntara does not mean that third-party services used
          alongside it are subject to the MIT License or to this Privacy Policy.
        </p>

        <h2>6. Children's Privacy</h2>
        <p>
          Syntara does not intentionally collect personal information from children or require
          users to provide personal information.
        </p>

        <h2>7. Changes to This Privacy Policy</h2>
        <p>
          We may update this Privacy Policy when necessary to reflect changes to Syntara, our
          website, or applicable requirements. The latest version will always be published on
          this page.
        </p>

        <h2>8. Contact</h2>
        <p>
          If you have questions about this Privacy Policy or Syntara's privacy practices, you can
          contact us through the contact information provided on the official Syntara website.
        </p>

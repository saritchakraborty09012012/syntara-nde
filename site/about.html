        <h1>About Syntara — Universal Local AI Platform by NDe</h1>
        <p>
          Syntara is an open-source local-AI platform by NDe (NoirDemons). It makes locally
          downloaded AI models usable from a desktop app, a local API, an SDK and automation
          flows, without sending your prompts to someone else's server.
        </p>
        <h2>Principles</h2>
        <ul>
          <li><b>Local-first</b> — prompts, model files and inference stay on your machine.</li>
          <li><b>No account, ever</b> — no login, no signup, no email verification, no activation step.</li>
          <li><b>Your models stay yours</b> — visible storage, no silent deletion, no unrequested conversion.</li>
          <li><b>Universal, not proprietary</b> — model formats, runtimes and accelerators are separate concerns.</li>
          <li><b>Honest about hardware</b> — capability-based detection with a CPU fallback that always works.</li>
          <li><b>Open source</b> — released under the MIT License.</li>
        </ul>
        <h2>What it does</h2>
        <ul>
          <li>Model Hub with discovery, import, detach and removal; GGUF, safetensors and Hugging Face ingestion.</li>
          <li>Backend routing across CPU, CUDA, Metal, Vulkan and ROCm, with RAM/VRAM/storage planning.</li>
          <li>Chat and permission-gated Agent workflows, projects and persistent local memory.</li>
          <li>Local backup, import and restore, plus an in-app host log viewer that uploads nothing.</li>
          <li>OpenAI-compatible local API bound to localhost, a Python SDK, a CLI and n8n/IDE integrations.</li>
        </ul>
        <h2>Who builds Syntara</h2>
        <p>
          Syntara is built by NDe (NoirDemons), the project name of Sarit Chakraborty, and is
          released under the MIT License.
        </p>

[package]
name = "syntara-desktop"
version = "0.1.0"
description = "Native desktop application for Syntara local AI"
authors = ["NDe"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "syntara_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["default", "tray-icon"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "net", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "charset", "http2", "macos-system-configuration"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
url = "2"
urlencoding = "2"
base64 = "0.22"

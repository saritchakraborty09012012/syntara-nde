[package]
name = "syntara-desktop"
version = "0.1.0"
description = "Native desktop application for Syntara local AI"
authors = ["NDe"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "syntara_desktop_lib"
# No cdylib: the desktop ships an .exe, and MinGW ld cannot link a DLL of
# this size (auto-export overflows its 65535-ordinal limit). The
# mobile_entry_point cfg never fires on desktop targets.
crate-type = ["staticlib", "rlib"]
# Unit-test harnesses cannot embed the comctl32 v6 manifest (build.rs can only
# reach `[[test]]` targets with rustc-link-arg-tests, and the harness would
# die with STATUS_ENTRYPOINT_NOT_FOUND before running a single test). Contract
# tests live in tests/ as integration targets, which do get the manifest.
test = false

[[bin]]
name = "syntara-desktop"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["default", "tray-icon"] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "net", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "charset", "http2", "macos-system-configuration"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
url = "2"
urlencoding = "2"
base64 = "0.22"

# Only storage.rs names it, and only under cfg(unix): statvfs is how the
# model-folder picker reports free space on Linux/macOS. It is already in the
# dependency tree through tauri, but a crate has to declare what it imports -
# being in Cargo.lock is not the same as being available to rustc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package]
name = "syntara-desktop"
version = "0.1.0"
description = "Native desktop application for Syntara local AI"
authors = ["NoirDemons"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "syntara_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["default", "tray-icon"] }

name: Desktop installers

# The website's download buttons resolve
#   https://github.com/<repo>/releases/latest/download/Syntara-Windows-x64-Setup.exe
# (site/src/lib/releases.ts), which only ever serves a real installer. That
# URL is a promise this workflow has to keep: until a tag is built here, every
# button on syntara-nde.vercel.app 404s instead of quietly dumping the source
# tree on the user (which is what "Source code (zip)" on the releases page is).
#
# The asset names are fixed on purpose. A versioned asset name would need the
# site to ask api.github.com before it can build a link, and that call is
# rate-limited per IP - the moment it is throttled, the honest thing (a direct
# installer link) becomes the bug again. Renaming an asset here without
# renaming it in site/src/lib/releases.ts breaks every button, so the two
# lists must be changed together.
#
# Triggered by the same `v*` tags as release.yml, which builds the portable
# source-free archives. Both upload to the same release; this one only ever
# adds installer files and never removes an existing asset.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to attach the installers to (e.g. 1.0.0).
          Required when dispatching by hand, because a manual run has no tag
          in github.ref_name - it has the branch name instead, and publishing
          installers under a branch name would create a release nobody's
          download button points at.
        required: true

permissions:
  contents: write

env:
  # Tag pushes carry the tag in github.ref_name; a manual run carries the
  # operator-supplied release tag instead. Both end up as the release the
  # site's `releases/latest/download/...` URLs resolve to.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            asset: Syntara-Windows-x64-Setup.exe
            bundle: nsis
            glob: "*.exe"
          - os: macos-latest
            name: macos
            asset: Syntara-macOS-arm64.dmg
            bundle: dmg
            glob: "*.dmg"
            # Apple Silicon, like the portable macos-arm64 archive release.yml
            # already ships. An x86_64 slice would need a second interpreter in
            # the bundle; shipping one honest slice beats shipping a bundle
            # that only starts on half the machines it advertises.
            rust_target: aarch64-apple-darwin
          - os: ubuntu-latest
            name: linux
            asset: Syntara-Linux-x86_64.AppImage
            bundle: appimage
            glob: "*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # tauri.conf.json runs `npm --prefix ../web run build` as
      # beforeBuildCommand, so web/node_modules has to exist before the
      # bundler starts - and it embeds the result into the binary.
      - name: Install frontend dependencies
        run: npm ci --prefix web

      # The tauri CLI (not tauri-action): the asset names here are fixed, and
      # tauri-action publishes under the bundler's own versioned names. Pinned
      # to the crate's version so the bundler that renders installer.nsi is the
      # one the template was vendored from.
      - name: Tauri CLI
        run: npm install -g @tauri-apps/cli@2.11.5

      # Pinned rather than left to whatever `python3` the image happens to
      # ship. The staging scripts are stdlib-only precisely so they run before
      # any dependency install, but that leaves them at the mercy of the
      # runner image: macos-latest puts Xcode's Python 3.9 on PATH, and 3.9
      # lacks tarfile's `filter=` keyword that the POSIX backend fetch used to
      # rely on. Pinning keeps the interpreter a build input instead of an
      # accident of the image.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # What makes the installer worth downloading: the Python package, an
      # interpreter, and the llama.cpp backend the GGUF runtime drives, so the
      # installed app runs a model with no internet, no system Python and no
      # runtime to install. --check executes the bundled interpreter against the
      # bundled package, so a payload that cannot start the host fails here.
      # bash is pinned for every platform: the steps below are POSIX (`${VAR#v}`,
      # `find -not -path`), and windows-latest's default shell is PowerShell,
      # which parses that script into a ParserError. Git Bash is on PATH on the
      # Windows runner, so the same step text works in the whole matrix.
      - name: Stage bundled runtime
        shell: bash
        run: |
          # `python3` is the real interpreter on the macOS and Linux runners
          # and `py -3` the launcher on Windows, but Windows also puts an
          # "App Execution Alias" stub for python3 on PATH which exists and then
          # prints "Python was not found" when run. `command -v` cannot tell
          # that apart from a working interpreter, so the probe executes the
          # candidate instead of merely locating it - and fails with an
          # actionable message rather than letting the alias's own error be
          # mistaken for a packaging failure.
          if python3 -c '' 2>/dev/null; then
            PY=python3
          elif py -3 -c '' 2>/dev/null; then
            PY="py -3"
          else
            echo "FAIL: no working Python 3 on this runner (tried python3, py -3)"
            exit 1
          fi
          echo "staging interpreter: $($PY -VV)"
          # The pinned backend goes in first, because --require-backend below
          # fails the build when it is missing. It used to print a NOTE and
          # publish anyway, so every installer shipped without it: the app
          # installed cleanly and then died at RuntimeNotAvailable.
          #
          # Both commands are teed into staging.log and their exit statuses
          # read back through PIPESTATUS, because tee would otherwise mask the
          # failure the runner has to act on. Redirecting the whole block with
          # `exec > >(tee ...)` would lose output to a process that may not be
          # scheduled again before the step ends.
          : > staging.log
          $PY tools/fetch_llama_cpp.py 2>&1 | tee -a staging.log
          fetch_status=${PIPESTATUS[0]}
          $PY tools/stage_desktop_resources.py --repo . --require-backend 2>&1 \
            | tee -a staging.log
          stage_status=${PIPESTATUS[0]}
          if [ "$fetch_status" -ne 0 ] || [ "$stage_status" -ne 0 ]; then
            echo "FAIL: staging failed (fetch_llama_cpp=$fetch_status, stage_desktop_resources=$stage_status)"
            exit 1
          fi

      # Runs even when the step above failed. Actions logs need a signed-in
      # session to read, which makes a staging failure painful to diagnose from
      # a bug report; an artifact is fetchable from the public API, so the
      # reason a release could not be built travels with the run.
      - name: Upload staging log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-log-${{ matrix.name }}
          path: staging.log
          if-no-files-found: warn

      # Run from `desktop/`, which is where tauri.conf.json's
      # `npm --prefix ../web run build` resolves from (see desktop/README.md:
      # `cd desktop && cargo tauri dev`). Running from the repository root
      # would look for `web` one directory above the checkout and fail before
      # a single line of Rust is compiled.
      - name: Build the installer
        shell: bash
        working-directory: desktop
        run: |
          ARGS="--bundles ${{ matrix.bundle }}"
          if [ -n "${{ matrix.rust_target }}" ]; then
            ARGS="$ARGS --target ${{ matrix.rust_target }}"
          fi
          # The version the app reports comes from the tag, not from the
          # placeholder in tauri.conf.json, so Settings shows the same number
          # as the release the button downloaded.
          ARGS="$ARGS --config {\"version\":\"${RELEASE_TAG#v}\"}"
          tauri build $ARGS

          # The bundler writes into one predictable place:
          #   target[/<triple>]/release/bundle/<bundler-kind>/
          # with --target the triple directory appears, and without it the path
          # collapses to target/release/....
          #
          # This used to be `find src-tauri/target -name "$glob" | head -1`,
          # which searched the *whole* target tree. On Windows the glob is
          # `*.exe` and the target tree holds a build script per dependency
          # crate, so v1.0.1 published one of those: 302,592 bytes of cargo
          # build script that prints an $RUSTC error and exits instead of
          # installing. Every job was green and only a user saw it. A fixed
          # glob is never a safe way to find a build output.
          if [ -n "${{ matrix.rust_target }}" ]; then
            PROFILE_DIR="src-tauri/target/${{ matrix.rust_target }}/release"
          else
            PROFILE_DIR="src-tauri/target/release"
          fi
          BUNDLE_DIR="$PROFILE_DIR/bundle/${{ matrix.bundle }}"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "FAIL: the bundler wrote no $BUNDLE_DIR"
            find src-tauri/target -type d -name bundle 2>/dev/null || true
            exit 1
          fi
          # `mapfile` is bash 4. The macOS runner executes this script with
          # /bin/bash 3.2, where it exits 127 - after the dmg was successfully
          # built. Arrays and process substitution both exist in bash 3.2, so
          # the exactly-one contract below holds on every runner.
          FOUND=()
          while IFS= read -r match; do
            FOUND+=("$match")
          done < <(find "$BUNDLE_DIR" -maxdepth 1 -type f -name "${{ matrix.glob }}")
          # Exactly one. Zero is a bundler that did not run; two means the
          # bundler started emitting a second candidate and the choice needs a
          # human. Guessing is what shipped the build script.
          if [ "${#FOUND[@]}" -ne 1 ]; then
            echo "FAIL: expected exactly one ${{ matrix.glob }} in $BUNDLE_DIR, found ${#FOUND[@]}:"
            printf '  %s\n' "${FOUND[@]:-<none>}"
            exit 1
          fi
          BUILT="${FOUND[0]}"
          # The file name IS the release asset name the website links to, so it
          # is set here rather than left to the bundler's versioned naming.
          mkdir -p out
          cp "$BUILT" "out/${{ matrix.asset }}"
          ls -lh "out/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          # The bundling step above runs with working-directory: desktop, so the
          # asset it copies into out/ lands in desktop/out/. Uploading `out/*`
          # from the repository root matched nothing, and upload-artifact only
          # warns on an empty glob: three empty artifacts were uploaded, the
          # step reported success, and the publish job then failed with no files
          # to upload. if-no-files-found: error makes that loud at the source.
          path: desktop/out/*
          if-no-files-found: error

  release:
    name: Publish installers to the release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Renaming an asset here without renaming it in site/src/lib/releases.ts
      # breaks every download button, so the two lists are checked, not trusted.
      EXPECTED_ASSETS: >-
        Syntara-Windows-x64-Setup.exe
        Syntara-macOS-arm64.dmg
        Syntara-Linux-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Each step below names one action. This used to be a single step called
      # "Upload" holding the wait, the create and the upload, so a failure could
      # only say "Upload" and the actual gh command had to be guessed at from the
      # job status alone.
      - name: Collect the built installers
        run: |
          # merge-multiple keeps whatever layout each artifact had, so a file can
          # land in a subdirectory and a bare "artifacts/*" glob would hand gh a
          # directory. What actually matters is that the three asset names the
          # website links to exist somewhere under artifacts/, so they are
          # located by name and uploaded by explicit path, at whatever depth.
          find artifacts -type f -printf '%f\n' | sort -u > names.txt
          missing=""
          for want in $EXPECTED_ASSETS; do
            grep -qFx "$want" names.txt || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            echo "FAIL: no built file is named:$missing"
            echo "--- tree ---"; find artifacts | sort
            echo "--- file names present ---"; cat names.txt
            exit 1
          fi
          : > installers.txt
          for want in $EXPECTED_ASSETS; do
            find artifacts -type f -name "$want" >> installers.txt
          done
          echo "collected:"; cat installers.txt

      # Existence is not validity, and for v1.0.1 existence was exactly the
      # problem: the Windows asset existed, had the right name, satisfied every
      # other check in this file, and was a cargo build script. This runs on
      # the bytes that are about to be published - after the upload/download
      # round trip, not on the file still sitting in the builder's out/ - and
      # demands the container magic each format must have. It is the last gate
      # before the download button starts serving it.
      - name: Verify each installer is a real installer
        run: |
          failed=0
          check() {
            kind="$1"; name="$2"
            # One file per name, so -print -quit rather than a second full walk.
            path="$(find artifacts -type f -name "$name" -print -quit)"
            if [ -z "$path" ]; then
              echo "FAIL: $name is not in the artifacts at all"
              failed=1; return
            fi
            if ! python3 tools/verify_installer.py --kind "$kind" "$path"; then
              failed=1
            fi
          }
          check nsis     Syntara-Windows-x64-Setup.exe
          check dmg      Syntara-macOS-arm64.dmg
          check appimage Syntara-Linux-x86_64.AppImage
          if [ "$failed" -ne 0 ]; then
            echo "FAIL: refusing to publish. At least one asset is not the"
            echo "      installer it claims to be; see the messages above."
            echo "      If this is a first-time release, re-run the release;"
            echo "      the previous tag's assets stay downloadable meanwhile."
            exit 1
          fi
          echo "all three assets are real installers"

      - name: Wait for the release from release.yml
        run: |
          TAG="$RELEASE_TAG"
          # release.yml creates the release; this workflow runs beside it and may
          # get there first. Waiting beats failing: a release with notes and no
          # installers is exactly the state this is here to prevent.
          for attempt in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG is up after $((attempt - 1)) waits"
              exit 0
            fi
            echo "release $TAG not published yet (attempt $attempt) - waiting 15s"
            sleep 15
          done
          echo "release $TAG still absent after 20 waits"

      - name: Create the release if release.yml did not
        run: |
          TAG="$RELEASE_TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          # release.yml failed. Publish what this workflow did build rather than
          # throwing three installers away -- and publish it, not as a draft: a
          # draft serves nothing, and the whole point of this job is that
          # /releases/latest/download/<asset> resolves to a real file. The notes
          # say plainly which archives are missing so the gap is not a surprise.
          gh release create "$TAG" --verify-tag --title "syntara $TAG" \
            --notes "Desktop installers for $TAG. The portable source-free archives in the Release workflow did not build for this tag; see that workflow's log."

      - name: Publish the release if it was left a draft
        run: |
          TAG="$RELEASE_TAG"
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "release $TAG is already published"
            exit 0
          fi
          # An earlier run of this workflow leaves a draft behind, and a draft is
          # the exact state this workflow exists to prevent: it is invisible to
          # the public API, so /releases/latest/download/<asset> keeps 404ing,
          # while `gh release view` still finds it for anyone with push access --
          # so the release looks published to this job while serving nothing to
          # the people downloading. Publish it.
          gh release edit "$TAG" --draft=false --title "syntara $TAG" \
            --notes "Desktop installers for $TAG. The portable source-free archives in the Release workflow did not build for this tag; see that workflow's log."
          echo "published the leftover draft for $TAG"

      - name: Upload the installers
        run: |
          TAG="$RELEASE_TAG"
          while read -r f; do
            echo "uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done < installers.txt

      - name: Report the published assets
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,assets \
            --jq '"draft=\(.isDraft)", "assets=\(.assets | length)", (.assets[].name)'

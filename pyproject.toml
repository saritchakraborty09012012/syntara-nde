[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syntara-engine"
dynamic = ["version"]
description = "Syntara local AI runtime and developer toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "NDe"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
convert = [
    "numpy",
    "huggingface_hub",
]
oracle = [
    "torch>=2.0",
    "transformers>=4.40",
    "safetensors",
]
bench = [
    "tokenizers",
    "datasets",
]

[project.scripts]
syntara = "syntara.cli:main"

[project.urls]
Homepage = "https://github.com/saritchakraborty09012012/syntara-nde"
Issues = "https://github.com/saritchakraborty09012012/syntara-nde/issues"

[tool.setuptools.dynamic]
version = {attr = "syntara._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["syntara*"]
exclude = ["syntara.tests*"]
